name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "true"

jobs:
  metadata:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve artifact version
        id: version
        shell: pwsh
        # Тег является источником версии релиза; при ручном запуске используется
        # ApplicationDisplayVersion, чтобы имя артефакта не зависело от ветки.
        run: |
          [xml]$project = Get-Content src/KidAbacusCalculator/KidAbacusCalculator.csproj -Raw
          $version = if ($env:GITHUB_REF_TYPE -eq "tag") {
            $env:GITHUB_REF_NAME -replace "^v", ""
          } else {
            $project.Project.PropertyGroup.ApplicationDisplayVersion
          }

          if ([string]::IsNullOrWhiteSpace($version)) {
            throw "Unable to resolve artifact version"
          }

          "value=$version" >> $env:GITHUB_OUTPUT

  windows:
    needs: metadata
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Install MAUI Windows workload
        run: dotnet workload install maui-windows --skip-manifest-update

      - name: Restore Windows
        # -f is not enough at restore: csproj also lists android, and android+win-x64
        # asks for Mono.win-x64 (NU1102). RuntimeIdentifiers pulls the win-x64 pack
        # without -r. -r rewrites Core assets to net10.0/win-x64; Core then builds as
        # net10.0 and fails. Restore Core --force last so its assets stay on net10.0.
        run: |
          dotnet restore src/KidAbacusCalculator/KidAbacusCalculator.csproj -p:TargetFrameworks=net10.0-windows10.0.19041.0 -p:RuntimeIdentifiers=win-x64
          dotnet restore src/KidAbacusCalculator.Core/KidAbacusCalculator.Core.csproj --force

      - name: Publish Windows win-x64
        # Self-contained Release enables ReadyToRun; restore did not pull the R2R
        # crossgen pack, and --no-restore then fails. Unpackaged MAUI does not need R2R.
        run: >
          dotnet publish src/KidAbacusCalculator/KidAbacusCalculator.csproj
          -f net10.0-windows10.0.19041.0
          -c Release
          -r win-x64
          --self-contained true
          --no-restore
          -p:TargetFrameworks=net10.0-windows10.0.19041.0
          -p:WindowsPackageType=None
          -p:PublishReadyToRun=false
          -o artifacts/windows-win-x64

      - name: Upload Windows win-x64
        uses: actions/upload-artifact@v4
        with:
          name: KidAbacusCalculator-${{ needs.metadata.outputs.version }}-windows-x64
          path: artifacts/windows-win-x64/

  android:
    needs: metadata
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install MAUI Android workload
        run: dotnet workload install maui-android --skip-manifest-update

      - name: Create CI signing keystore
        # Ephemeral debug/auto keystore — not a production Play Store key.
        run: >
          keytool -genkeypair -v
          -keystore "${{ github.workspace }}/kidabacus-ci.keystore"
          -alias kidabacus
          -keyalg RSA -keysize 2048 -validity 10000
          -storepass android -keypass android
          -dname "CN=KidAbacusCalculator CI, OU=CI, O=KidAbacusCalculator, L=Local, S=Local, C=US"

      - name: Restore Android
        # -r android-arm64 on publish would restore Core as net10.0/android-arm64
        # and the Core compile then looks for net10.0.
        run: |
          dotnet restore src/KidAbacusCalculator/KidAbacusCalculator.csproj -p:TargetFrameworks=net10.0-android -p:RuntimeIdentifiers=android-arm64
          dotnet restore src/KidAbacusCalculator.Core/KidAbacusCalculator.Core.csproj --force

      - name: Publish Android APK
        run: >
          dotnet publish src/KidAbacusCalculator/KidAbacusCalculator.csproj
          -f net10.0-android
          -c Release
          -r android-arm64
          --no-restore
          -p:AndroidPackageFormat=apk
          -p:AndroidKeyStore=true
          -p:AndroidSigningKeyStore=${{ github.workspace }}/kidabacus-ci.keystore
          -p:AndroidSigningKeyAlias=kidabacus
          -p:AndroidSigningKeyPass=android
          -p:AndroidSigningStorePass=android
          -o artifacts/android

      - name: Collect APK
        run: |
          mkdir -p release-apk
          mapfile -t apks < <(find artifacts/android src/KidAbacusCalculator/bin -type f -name '*Signed.apk' 2>/dev/null | head -n 5)
          if [ ${#apks[@]} -eq 0 ]; then
            mapfile -t apks < <(find artifacts/android src/KidAbacusCalculator/bin -type f -name '*.apk' 2>/dev/null | head -n 5)
          fi
          if [ ${#apks[@]} -eq 0 ]; then
            echo "No APK found after publish" >&2
            find artifacts/android src/KidAbacusCalculator/bin -type f 2>/dev/null | head -n 50 || true
            exit 1
          fi
          cp "${apks[0]}" "release-apk/KidAbacusCalculator-${{ needs.metadata.outputs.version }}-arm64.apk"
          echo "Packed ${apks[0]}"

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: KidAbacusCalculator-${{ needs.metadata.outputs.version }}-arm64
          path: release-apk/KidAbacusCalculator-${{ needs.metadata.outputs.version }}-arm64.apk

  github-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [metadata, windows, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Pack archives
        # Имена файлов отражают приложение, версию, платформу и архитектуру.
        run: |
          set -euo pipefail
          cd dist
          zip -r "../KidAbacusCalculator-${{ needs.metadata.outputs.version }}-windows-x64.zip" "KidAbacusCalculator-${{ needs.metadata.outputs.version }}-windows-x64"
          cp "KidAbacusCalculator-${{ needs.metadata.outputs.version }}-arm64/KidAbacusCalculator-${{ needs.metadata.outputs.version }}-arm64.apk" "../KidAbacusCalculator-${{ needs.metadata.outputs.version }}-arm64.apk"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            KidAbacusCalculator-${{ needs.metadata.outputs.version }}-windows-x64.zip
            KidAbacusCalculator-${{ needs.metadata.outputs.version }}-arm64.apk
          generate_release_notes: true
          body: |
            ## Artifacts
            - **Windows** (`win-x64`, self-contained, unpackaged MAUI)
            - **Android APK** — signed with an ephemeral CI keystore (sideload/testing only, not Play Store)
