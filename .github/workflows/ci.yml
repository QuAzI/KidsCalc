name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "true"

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: |
          dotnet restore src/KidAbacusCalculator.Core/KidAbacusCalculator.Core.csproj
          dotnet restore tests/KidAbacusCalculator.Tests/KidAbacusCalculator.Tests.csproj

      - name: Build Core (Release)
        run: >
          dotnet build src/KidAbacusCalculator.Core/KidAbacusCalculator.Core.csproj
          -c Release
          --no-restore

      - name: Test
        # Тесты — консольный exe без VSTest, поэтому run вместо dotnet test.
        run: >
          dotnet run
          --project tests/KidAbacusCalculator.Tests/KidAbacusCalculator.Tests.csproj
          -c Release
          --no-restore

  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Install MAUI Windows workload
        run: dotnet workload install maui-windows --skip-manifest-update

      - name: Restore Windows
        # restore has no --framework (-f is --force → MSB1008). Override TargetFrameworks
        # to the Windows TFM (csproj also lists android). RuntimeIdentifiers (not -r)
        # pulls the win-x64 runtime pack (NETSDK1112) and keeps RID-less TFM targets;
        # -r alone rewrites Core assets to net10.0/win-x64 and the Core build then
        # fails looking for net10.0. Restore Core last so its assets stay on net10.0.
        run: |
          dotnet restore src/KidAbacusCalculator/KidAbacusCalculator.csproj -p:TargetFrameworks=net10.0-windows10.0.19041.0 -p:RuntimeIdentifiers=win-x64
          dotnet restore src/KidAbacusCalculator.Core/KidAbacusCalculator.Core.csproj --force

      - name: Build Windows (Release)
        run: >
          dotnet build src/KidAbacusCalculator/KidAbacusCalculator.csproj
          -c Release
          -f net10.0-windows10.0.19041.0
          -r win-x64
          --no-restore
